<div class="max-w-2xl mx-auto p-6">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">New product</h1>

  @if (errorMessage()) {
    <div class="mb-4 p-3 bg-red-100 text-red-700 border border-red-200 rounded text-sm">
      {{ errorMessage() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Product Name *</label>
      <input 
        type="text" 
        [(ngModel)]="name" 
        name="name" 
        class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black"
        placeholder="ex. Black T-Shirt"
      />
    </div>
    <div class="flex gap-4">
      <div class="w-1/2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Brand</label>
        <input 
          type="text" 
          [(ngModel)]="brand" 
          name="brand" 
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black"
          
        />
      </div>

      <div class="w-1/2">
        <label class="block text-sm font-medium text-gray-700 mb-1">SKU *</label>
        <input 
          type="text" 
          [(ngModel)]="sku" 
          name="sku" 
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black"
          placeholder="ex. ABC-001"
        />
      </div>
    </div>
    <div class="flex gap-4">
      <div class="w-1/2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Price *</label>
        <input 
          type="number" 
          [(ngModel)]="price" 
          name="price" 
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black"
          placeholder="199"
        />
      </div>

      <div class="w-1/2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
        <input 
          type="date" 
          [(ngModel)]="date" 
          name="date" 
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black"
        />
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Product Image *</label>
      <input 
        type="text" 
        [(ngModel)]="image" 
        name="image" 
        class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black"
        placeholder="https://..."
      />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <textarea 
        rows="4" 
        [(ngModel)]="description" 
        name="description" 
        class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black"
        placeholder="Product description..."
      ></textarea>
    </div>
    <div class="pt-2">
      <button 
        type="submit" 
        [disabled]="!isValid() || isSubmitting()"
        class="w-full sm:w-auto px-6 py-2.5 bg-black text-white text-sm font-medium rounded hover:bg-gray-800 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
      >
        {{ isSubmitting() ? 'Adding...' : 'Add Product' }}
      </button>
    </div>
  </form>
</div>
