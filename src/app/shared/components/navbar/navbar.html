<nav class="bg-black">
  <section class="flex.col p-3">
    <a routerLink="/" class="">
      <img  src="logotest.png" alt="logo" RouterLink="/" />
    </a>
    <div class="flex pt-3 pb-3 justify-between">
      <form (ngSubmit)="onSearch()" class="flex-1 max-w-md">
        <div class="relative">
          <input
            type="search"
            name="q"
            [(ngModel)]="searchQuery"
            placeholder="Search..."
            class="w-full bg-gray-100 border border-transparent rounded-full py-2 pl-4 pr-10 text-sm focus:bg-white focus:border-gray-300 focus:outline-none"
          />
          <button
            type="submit"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700"
            aria-label="search"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
          </button>
        </div>
      </form>
      <div class="flex gap-2 text-white self-center">
        <a><img src="favoriteicon.svg" alt="heart" /></a>
        <a><img src="carticon.svg" alt="cart" /></a>
      </div>
    </div>

    <div class="flex text-white font-bold justify-around">
      <a class="cursor-pointer">News</a>
      <a class="cursor-pointer">Popular</a>
      <a class="cursor-pointer">Sale</a>
    </div>
  </section>
</nav>
