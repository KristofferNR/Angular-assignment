<article class="group relative flex flex-col overflow-hidden border border-gray-200 bg-white p-4">
  <a [routerLink]="['/products', product().slug]" class="flex flex-col h-full">
    <div class="aspect-[3/4] w-full overflow-hidden bg-gray-100 mb-4">
      <img
        [src]="product().image"
        [alt]="product().name"
        class="h-full w-full object-cover object-center group-hover:scale-105 transition-transform duration-300"
      />
    </div>
    <span class="text-xs text-gray-500 uppercase tracking-wider">{{ product().brand }}</span>
    <h3 class="font-medium text-gray-900 mt-1">{{ product().name }}</h3>
    <p class="font-bold text-gray-900 mt-auto pt-2">{{ product().price }} SEK</p>
  </a>
</article>
