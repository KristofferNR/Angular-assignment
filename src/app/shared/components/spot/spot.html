<a
  [routerLink]="spot().slug"
  class="group relative block w-full overflow-hidden bg-gray-100 aspect-[3/4] sm:aspect-auto sm:h-96"
>
  <img
    [src]="spot().image"
    [alt]="spot().name"
    class="h-full w-full object-cover object-center group-hover:scale-105 transition-transform duration-300"
  />
  <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
  <div class="absolute bottom-0 left-0 right-0 p-6 flex flex-col justify-end">
    <h3 class="text-xl font-bold text-white tracking-wide uppercase">
      {{ spot().name }}
    </h3>
    <span
      class="text-xs font-semibold text-gray-200 mt-1 underline underline-offset-4 group-hover:text-white"
    >
      Explore
    </span>
  </div>
</a>
