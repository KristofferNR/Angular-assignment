<section
  class="relative w-full h-[40vh] min-h-[420px] max-h-[650px] overflow-hidden bg-neutral-900 flex items-center justify-center"
>
  <img
    [src]="hero().image"
    [alt]="hero().name"
    class="absolute inset-0 w-full h-full object-cover object-center"
  />

  <div class="absolute inset-0 bg-black/40"></div>

  <div
    class="relative z-10 max-w-4xl mx-auto px-6 text-center text-white flex flex-col items-center"
  >
    @if (hero().description) {
      <span
        class="text-xs sm:text-sm font-semibold tracking-widest uppercase mb-3 text-neutral-300"
      >
        {{ hero().description }}
      </span>
    }

    <h1
      class="text-3xl sm:text-5xl md:text-6xl font-extrabold tracking-tight uppercase mb-6 leading-tight"
    >
      {{ hero().name }}
    </h1>

    <a
      [routerLink]="['/products', hero().slug]"
      class="inline-block bg-white text-black font-semibold text-xs sm:text-sm uppercase tracking-wider px-8 py-3.5 hover:bg-neutral-200 transition-colors shadow-lg"
    >
      View
    </a>
  </div>
</section>
