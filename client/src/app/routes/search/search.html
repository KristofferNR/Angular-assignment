<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="mb-8">
    <h1 class="text-2xl font-bold tracking-tight text-gray-900">
      Search results for: <span class="italic font-normal text-gray-600">{{ query() }}</span>
    </h1>
  </div>

  @if (searchResult.isLoading()) {
    <p class="text-center text-gray-400 py-16">Searching...</p>
  } @else if (query() && searchResult.value().length === 0) {
    <div class="text-center py-16">
      <p class="text-gray-600 text-lg">No products found</p>
    </div>
  } @else {
    <p class="text-sm text-gray-500 mb-6">
      Results {{ searchResult.value().length }}
    </p>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (item of searchResult.value(); track item.id) {
        <product-card [product]="item" />
      }
    </div>
  }
</section>
